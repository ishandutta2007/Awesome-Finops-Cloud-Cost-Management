<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0b0f19; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; border-radius:12px; overflow:hidden;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="lineGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="lineGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Filter for glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* CSS Keyframes for dynamic background elements */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(25px, -15px); opacity: 0.6; }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes dashCycle {
      0% { stroke-dashoffset: 1000; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes radarPulse {
      0% { r: 4px; opacity: 1; }
      100% { r: 24px; opacity: 0; }
    }
    @keyframes costDrop {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    .pulsing-orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .pulsing-orb-2 { animation: pulseOrb 10s ease-in-out infinite reverse; transform-origin: 1000px 260px; }
    .flow-line { stroke-dasharray: 12, 8; animation: dashCycle 35s linear infinite; }
    .float-1 { animation: floatCard1 6s ease-in-out infinite; }
    .float-2 { animation: floatCard2 7s ease-in-out infinite; }
    .radar { animation: radarPulse 2.5s cubic-bezier(0.2, 0.8, 0.2, 1) infinite; }
    .badge-pop { animation: costDrop 4s ease-in-out infinite; }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="360" fill="url(#bgGlow)" />

  <!-- Animated Ambient Orbs in Background -->
  <g class="pulsing-orb-1">
    <circle cx="220" cy="90" r="140" fill="#38bdf8" filter="url(#glow)" opacity="0.12" />
  </g>
  <g class="pulsing-orb-2">
    <circle cx="980" cy="240" r="160" fill="#818cf8" filter="url(#glow)" opacity="0.15" />
    <circle cx="1060" cy="120" r="100" fill="#34d399" filter="url(#glow)" opacity="0.08" />
  </g>

  <!-- FinOps Financial Graph Grid (Subtle Background) -->
  <g opacity="0.12" stroke="#64748b" stroke-width="1">
    <line x1="50" y1="60" x2="1150" y2="60" stroke-dasharray="4,4" />
    <line x1="50" y1="130" x2="1150" y2="130" stroke-dasharray="4,4" />
    <line x1="50" y1="200" x2="1150" y2="200" stroke-dasharray="4,4" />
    <line x1="50" y1="270" x2="1150" y2="270" stroke-dasharray="4,4" />
    <line x1="150" y1="40" x2="150" y2="320" stroke-dasharray="4,4" />
    <line x1="450" y1="40" x2="450" y2="320" stroke-dasharray="4,4" />
    <line x1="750" y1="40" x2="750" y2="320" stroke-dasharray="4,4" />
    <line x1="1050" y1="40" x2="1050" y2="320" stroke-dasharray="4,4" />
  </g>

  <!-- Dynamic Animated Trend Curves (Background/Midground) -->
  <!-- Cost Optimization Curve (Decreasing spend trend) -->
  <path d="M 60 260 Q 240 280, 420 180 T 780 150 T 1140 90" fill="none" stroke="url(#lineGrad1)" stroke-width="3" opacity="0.35" class="flow-line" />
  
  <!-- Efficiency / ROI Curve (Increasing efficiency) -->
  <path d="M 60 300 C 260 290, 480 320, 700 210 C 900 120, 1020 110, 1140 60" fill="none" stroke="url(#lineGrad2)" stroke-width="2.5" opacity="0.25" stroke-dasharray="8,6" />

  <!-- Animated Radar Pulse Beacon at Cost Anomaly Detection Point -->
  <g transform="translate(780, 150)">
    <circle cx="0" cy="0" r="4" fill="#34d399" />
    <circle cx="0" cy="0" r="4" stroke="#34d399" fill="none" stroke-width="1.5" class="radar" />
  </g>

  <!-- Interactive / Floating Glassmorphic Metric Cards (Positioned safely on the right) -->
  <g class="float-1" transform="translate(860, 52)">
    <rect width="260" height="74" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5" />
    <!-- Mini sparkline -->
    <path d="M 180 50 L 195 42 L 210 46 L 225 32 L 240 28" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" />
    <circle cx="240" cy="28" r="3" fill="#34d399" filter="url(#softGlow)" />
    <text x="20" y="30" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="0.5">CLOUD SPEND REDUCTION</text>
    <text x="20" y="56" fill="#f8fafc" font-size="22" font-weight="800">-34.8%</text>
    <rect x="105" y="40" width="56" height="20" rx="10" fill="#10b981" fill-opacity="0.2" />
    <text x="133" y="54" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">OPTIMIZED</text>
  </g>

  <g class="float-2" transform="translate(890, 146)">
    <rect width="250" height="74" rx="12" fill="url(#cardGrad)" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1.5" />
    <text x="20" y="30" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="0.5">UNIT COST ALLOCATION</text>
    <text x="20" y="56" fill="#f8fafc" font-size="22" font-weight="800">99.4%</text>
    <text x="96" y="55" fill="#38bdf8" font-size="12" font-weight="600">Coverage</text>
    <circle cx="215" cy="42" r="14" fill="#6366f1" fill-opacity="0.2" stroke="#818cf8" stroke-width="1.5" />
    <path d="M 211 42 L 214 45 L 220 39" fill="none" stroke="#a5b4fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <g class="float-1" transform="translate(830, 240)">
    <rect width="280" height="66" rx="12" fill="url(#cardGrad)" stroke="#34d399" stroke-opacity="0.3" stroke-width="1.5" />
    <text x="20" y="28" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="0.5">AUTOMATED COMMITMENTS</text>
    <text x="20" y="51" fill="#34d399" font-size="18" font-weight="800">SP / RI / CUD Autopilot</text>
    <rect x="215" y="22" width="48" height="22" rx="6" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1" />
    <text x="239" y="37" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">ACTIVE</text>
  </g>

  <!-- FOREGROUND: Core Branding & Typography (Guaranteed Unobscured) -->
  <g transform="translate(80, 0)">
    
    <!-- Top Category Pill Tag -->
    <g transform="translate(0, 52)">
      <rect width="265" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
      <circle cx="16" cy="16" r="5" fill="#38bdf8">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="30" y="21" fill="#e2e8f0" font-size="12" font-weight="700" letter-spacing="1.2">CURATED FINOPS DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="140" fill="url(#titleGrad)" font-size="44" font-weight="900" letter-spacing="-0.5" filter="url(#softGlow)">
      Awesome FinOps &amp;
    </text>
    <text x="0" y="190" fill="#f8fafc" font-size="44" font-weight="900" letter-spacing="-0.5">
      Cloud Cost Management
    </text>

    <!-- Subtitle / Value Proposition -->
    <text x="0" y="235" fill="#94a3b8" font-size="16" font-weight="400" line-height="1.5">
      Architectural governance, unit economics, automated rightsizing,
    </text>
    <text x="0" y="260" fill="#cbd5e1" font-size="16" font-weight="500">
      and multi-cloud spend visibility across SaaS &amp; Open-Source ecosystems.
    </text>

    <!-- Bottom Feature Badges / Meta Pills -->
    <g transform="translate(0, 288)">
      <!-- Pill 1: Multi-cloud -->
      <rect x="0" y="0" width="130" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="65" y="18" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle">☁️ Multi-Cloud</text>

      <!-- Pill 2: Kubernetes -->
      <rect x="140" y="0" width="130" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="205" y="18" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle">☸️ Kubernetes</text>

      <!-- Pill 3: Unit Economics -->
      <rect x="280" y="0" width="140" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="350" y="18" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle">📊 Unit Economics</text>

      <!-- Pill 4: Open Source -->
      <rect x="430" y="0" width="130" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="495" y="18" fill="#34d399" font-size="12" font-weight="700" text-anchor="middle">🔓 Open Source</text>
    </g>

  </g>
</svg>
